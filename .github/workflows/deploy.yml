name: Deploy Java App

on:
  push:
    branches: [ ramaFena ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        
      - name: Verificar conectividad SSH
        run: |
          echo "Verificando conectividad con el servidor..."
          timeout 10 nc -zv ${{ secrets.HOST_USUARIOS }} 22 || echo "No se puede conectar al servidor"
        
      - name: Preparar directorio en el servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_USUARIOS }}
          username: ${{ secrets.USER_USUARIOS }}
          key: ${{ secrets.SSH_KEY_USUARIO }}
          port: 22
          timeout: 60s
          script: |
            echo "Preparando directorio del proyecto..."
            rm -rf ~/proyecto-java
            mkdir -p ~/proyecto-java
            
      - name: Subir archivos al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST_USUARIOS }}
          username: ${{ secrets.USER_USUARIOS }}
          key: ${{ secrets.SSH_KEY_USUARIO }}
          port: 22
          source: "./*"
          target: "/home/${{ secrets.USER_USUARIOS }}/proyecto-java/"
          rm: true
          
      - name: Compilar aplicación
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_USUARIOS }}
          username: ${{ secrets.USER_USUARIOS }}
          key: ${{ secrets.SSH_KEY_USUARIO }}
          port: 22
          timeout: 300s
          script: |
            cd ~/proyecto-java
            echo "Verificando Java y Maven..."
            java -version
            mvn -version
            
            echo "Compilando proyecto..."
            mvn clean package -DskipTests -q
            
            echo "Verificando JAR generado..."
            ls -la target/usuarios-0.0.1-SNAPSHOT.jar
            
      - name: Desplegar aplicación
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_USUARIOS }}
          username: ${{ secrets.USER_USUARIOS }}
          key: ${{ secrets.SSH_KEY_USUARIO }}
          port: 22
          timeout: 120s
          script: |
            cd ~/proyecto-java
            
            echo "Deteniendo aplicación anterior..."
            pkill -f 'usuarios.*\.jar' || echo "No hay procesos de usuarios ejecutándose"
            sleep 3
            
            echo "Iniciando nueva aplicación..."
            tmux new-session -d -s usuarios_app "java -jar target/usuarios-0.0.1-SNAPSHOT.jar > app.log 2>&1"
            sleep 5
            echo "Aplicación iniciada en segundo plano"
            
            echo "Esperando 15 segundos para que arranque..."
            sleep 15
            
            echo "Verificando proceso..."
            if pgrep -f 'usuarios.*\.jar' > /dev/null; then
                echo "✅ Aplicación desplegada exitosamente"
                echo "PID del proceso:" $(pgrep -f 'usuarios.*\.jar')
            else
                echo "❌ Error: La aplicación no está corriendo"
                echo "Log de errores:"
                tail -10 app.log
                exit 1
            fi