name: Deploy Java App

on:
  push:
    branches: [ ramaFena ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Subir proyecto y ejecutar en el servidor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST_USUARIOS }}
          username: ${{ secrets.USER_USUARIOS }}
          key: ${{ secrets.SSH_KEY_USUARIO }}
          script: |
            rm -rf ~/proyecto-java
            mkdir -p ~/proyecto-java
            exit
      - name: Enviar archivos al servidor
        run: |
          rsync -avz --delete ./ ${{ secrets.USER_USUARIOS }}@${{ secrets.HOST_USUARIOS }}:/home/${{ secrets.USER_USUARIOS }}/proyecto-java

      - name: Compilar y levantar la app
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST_USUARIOS }}
          username: ${{ secrets.USER_USUARIOS }}
          key: ${{ secrets.SSH_KEY_USUARIO }}
          script: |
            cd ~/proyecto-java
            mvn clean package
            pkill -f '.jar' || true
            nohup java -jar target/*.jar > salida.log 2>&1 &
