spring.application.name=$MICRO_SERVICE_MATERIAL
spring.datasource.url=$DATABASE_URL_MATERIAL
spring.datasource.username=$DATABASE_USERNAME_MATERIAL
spring.datasource.password=$DATABASE_PASSWORD_MATERIAL
server.port=$DATABASE_PORT_MATERIAL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
